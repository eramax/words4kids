<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بطاقات القراءة</title>
  <style>
    :root {
      --bg1: #0b1220;
      --bg2: #111b2f;
      --bg3: #17112a;
      --card: rgba(17, 24, 39, 0.82);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #fbbf24;
      --accent2: #22d3ee;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      --radius: 32px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Tahoma, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(251, 191, 36, 0.18), transparent 30%),
        radial-gradient(circle at left center, rgba(34, 211, 238, 0.15), transparent 28%),
        radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.12), transparent 24%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      overflow: hidden;
    }

    .app {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      color: var(--muted);
      font-weight: 700;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 10px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }

    .stage {
      flex: 1;
      display: grid;
      place-items: center;
      position: relative;
    }

    .card {
      width: min(92vw, 860px);
      height: min(68vh, 560px);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
      position: relative;
      transform: translateY(0);
      transition: transform 180ms ease, opacity 180ms ease;
      backdrop-filter: blur(14px);
      user-select: none;
    }

    .card.flash {
      transform: scale(0.985);
      opacity: 0.88;
    }

    .word {
      font-size: clamp(56px, 12vw, 132px);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
      max-width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .subtext {
      margin-top: 18px;
      font-size: clamp(16px, 2vw, 22px);
      color: var(--muted);
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 4px;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 800;
      color: #0b1220;
      background: linear-gradient(135deg, var(--accent), #f97316);
      box-shadow: 0 14px 30px rgba(245, 158, 11, 0.28);
      cursor: pointer;
      min-width: 110px;
    }

    button.secondary {
      background: linear-gradient(135deg, var(--accent2), #06b6d4);
      box-shadow: 0 14px 30px rgba(14, 165, 164, 0.24);
    }

    button.ghost {
      background: rgba(15, 23, 42, 0.76);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
    }

    .hint {
      text-align: center;
      color: rgba(203, 213, 225, 0.8);
      font-size: 14px;
      padding-bottom: 4px;
    }

    @media (max-width: 640px) {
      .app { padding: 12px; }
      .topbar { padding: 8px 4px; font-size: 14px; }
      .card { height: min(64vh, 500px); border-radius: 24px; }
      button { min-width: 96px; padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="pill" id="counter">0 / 0</div>
        <button class="ghost" id="shuffleBtn">خلط</button>
      </div>
      <div class="pill" id="mode">بطاقات القراءة</div>
    </header>

    <section class="stage">
      <div class="card" id="card" aria-live="polite">
        <div>
          <div class="word" id="word">...</div>
          <div class="subtext" id="subtext">اضغط التالي أو السابق</div>
        </div>
      </div>
    </section>

    <nav class="controls" aria-label="بطاقات التحكم">
      <button class="ghost" id="prevBtn">السابق</button>
      <button class="secondary" id="nextBtn">التالي</button>
    </nav>

    <div class="hint">يمكنك استخدام الأسهم في لوحة المفاتيح أو النقر على الشاشة.</div>
  </main>

    const state = {
      words: [],
      index: 0,
    };

    const card = document.getElementById("card");
    const wordEl = document.getElementById("word");
    const subtextEl = document.getElementById("subtext");
    const counterEl = document.getElementById("counter");

    function flash() {
      card.classList.add("flash");
      window.setTimeout(() => card.classList.remove("flash"), 160);
    }

    function render() {
      const total = state.words.length;
      const current = state.words[state.index];
      wordEl.textContent = current?.text ?? "لا توجد كلمات";
      subtextEl.textContent = "";
      subtextEl.style.display = "none";
      counterEl.textContent = `${total ? state.index + 1 : 0} / ${total}`;
      document.title = current?.text ? `${current.text} - بطاقات القراءة` : "بطاقات القراءة";
    }

    function next() {
      if (!state.words.length) return;
      state.index = (state.index + 1) % state.words.length;
      flash();
      render();
    }

    function prev() {
      if (!state.words.length) return;
      state.index = (state.index - 1 + state.words.length) % state.words.length;
      flash();
      render();
    }

    function shuffle() {
      for (let i = state.words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.words[i], state.words[j]] = [state.words[j], state.words[i]];
      }
      state.index = 0;
      flash();
      render();
    }

    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("shuffleBtn").addEventListener("click", shuffle);
    card.addEventListener("click", next);

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === " ") {
        event.preventDefault();
        next();
      } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        event.preventDefault();
        prev();
      }
    });

    loadWords();
  </script>
</body>
</html>
